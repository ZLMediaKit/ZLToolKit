name: Windows

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v1
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: 配置 vcpkg
        uses: lukka/run-vcpkg@v7
        with:
          vcpkgDirectory: '${{github.workspace}}/vcpkg'
          vcpkgTriplet: x64-windows-static
          # 2021.05.12
          vcpkgGitCommitId: '5568f110b509a9fd90711978a7cb76bae75bb092'
          vcpkgArguments: 'openssl'

      - name: 编译
        uses: lukka/run-cmake@v3
        with:
          useVcpkgToolchainFile: true
          buildDirectory: '${{github.workspace}}/build'
          cmakeAppendedArgs: ''
          cmakeBuildType: 'RelWithDebInfo'

      - name: 诊断门禁运行环境(临时,定位后移除)
        working-directory: '${{github.workspace}}/build'
        run: |
          Write-Host "=== 构建根目录下的 dll ==="
          Get-ChildItem -Filter *.dll -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
          Write-Host "=== bin 目录内容 ==="
          Get-ChildItem bin -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
          Write-Host "=== 直接运行 test_variant.exe ==="
          & .\bin\test_variant.exe
          Write-Host "exit code = $LASTEXITCODE"
          Write-Host "=== 依赖分析 ==="
          $dumpbin = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) {
            Write-Host "--- test_variant.exe 的依赖 ---"
            & $dumpbin.FullName /dependents bin\test_variant.exe
            Write-Host "--- ZLToolKit.dll 的依赖 ---"
            & $dumpbin.FullName /dependents bin\ZLToolKit.dll
          } else { Write-Host "dumpbin 未找到" }
        continue-on-error: true

      - name: 执行门禁用例
        working-directory: '${{github.workspace}}/build'
        # 门禁用例见 tests/CMakeLists.txt 的 GATING_TESTS，失败则中断流水线。
        # --no-tests=error 不可省略：一个用例都没注册时 ctest 默认返回成功，门禁会悄悄失效。
        # 当前生成器为单配置，-C 实际不起作用，保留是为了将来换成多配置生成器时仍然正确，
        # 其取值需与上面的 cmakeBuildType 保持一致
        # Gating cases are listed in GATING_TESTS in tests/CMakeLists.txt, a failure breaks the
        # pipeline. --no-tests=error is required: with no test registered ctest succeeds by default
        # and the gate would silently stop guarding anything. The generator in use is single-config
        # so -C has no effect today; it is kept so that switching to a multi-config generator keeps
        # working, and its value has to match the cmakeBuildType above
        run: ctest -C RelWithDebInfo --output-on-failure --no-tests=error
